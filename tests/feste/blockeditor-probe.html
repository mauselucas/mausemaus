<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockeditor — Prüfseite</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/inhalt.css">
<link rel="stylesheet" href="/assets/admin.css">
<style>
  /* Bewusst OHNE Anmeldung: diese Seite hängt den Blockeditor direkt an
     einen erfundenen Datenspeicher (window.__api), der sich wie Supabase
     verhält (async, mit künstlicher Verzögerung), aber komplett im
     Arbeitsspeicher lebt. Genau das macht den Editor prüfbar, ohne ein
     Passwort zu kennen -- siehe tests/pruefe-editor.mjs. */
  body.admin { padding: 0; }
</style>
<body class="admin">

<!-- Blumen-Formen für den Trennstrich -- der öffentliche Umsetzer zeichnet
     hier dieselben Blöcke wie auf der Website. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="bl-a"><path d="M133.16,237.99c-27.41,30.79-70.23,50.09-108.82,27.42-52.03-30.05-9.9-88.95,26.67-111.64,13.68-9.57-3.11-19.24-9.83-27.25-22.29-22.11-15.89-64.81,14.36-76.37,19.47-7.55,41.05-1.43,59.19,7.2,30.33,16.74,20.74-31.04,56.28-50.89,20.6-12.12,49.99-6.68,64.78,12.11,21.92,29.53-20.36,62.52,7.41,59.6,63.44-16.1,84.14,47.01,24.47,73.12-25.08,15.3,28.46,25.23,33.07,68.9,1.88,50.65-67.55,63.04-101.36,36.42-31.17-16.42-35.94-52.26-66.21-18.63ZM181.49,172.16c25.07-7.83,36.49-38.21,21.19-60.04-21.35-29.92-69.93-20.46-76.64,16.25-4.81,30.78,27.11,53.37,55.45,43.78Z"/></g>
</defs></svg>

<!-- Gleicher Aufbau wie im echten Editor (admin.html): eine Spalte,
     Kopfleiste, Titel als erste Zeile des Dokuments. Bildschirmfotos
     dieser Prüfseite zeigen deshalb, wie der Editor wirklich aussieht. -->
<main id="view-edit">
  <header class="edit-kopf">
    <button class="stumm">← Zurück</button>
    <span class="status" id="speicher-status" aria-live="polite"></span>
    <span class="flex"></span>
    <span class="klein grau">Prüfseite — nicht echt, keine Anmeldung nötig</span>
  </header>

  <div class="dok-bereich">
    <article class="dokument" id="dokument">
      <input id="f-titel" class="dok-titel" value="The Race — Staffel 3" autocomplete="off">
      <div id="nur-projekt-welt">
        <textarea id="f-untertitel" class="dok-untertitel" rows="2">Mediengestalter Bild &amp; Ton · für Joyn/ProSieben</textarea>
      </div>
      <div id="block-editor"></div>
    </article>
  </div>
</main>

<script src="/assets/config.js"></script>
<script src="/assets/shared.js"></script>
<script src="/assets/bloecke.js"></script>
<script src="/assets/inhalt.js"></script>
<script type="module">
  import { mountBlockEditor } from '/assets/blockeditor.js';

  /* ---- erfundener Datenspeicher, verhält sich wie Supabase (async) ---- */
  const VERZOEGERUNG = 40;
  const warte = (ms) => new Promise(r => setTimeout(r, ms));
  const zeilen = new Map();   // id -> Zeile, wie eine echte Tabelle
  let naechsteId = 1;
  const aufrufe = { neu: 0, aktualisieren: 0, loeschen: 0 };

  window.__api_zeilen = zeilen;   // für die Prüfung von außen einsehbar
  window.__aufrufe = aufrufe;

  const api = {
    async neu(entwurf) {
      aufrufe.neu++;
      await warte(VERZOEGERUNG);
      const id = 'blk-' + (naechsteId++);
      zeilen.set(id, { id, ...structuredClone(entwurf) });
      return { id };
    },
    async aktualisieren(id, felder) {
      aufrufe.aktualisieren++;
      await warte(VERZOEGERUNG);
      const bisher = zeilen.get(id) || { id };
      zeilen.set(id, { ...bisher, ...structuredClone(felder) });
    },
    async loeschen(id) {
      aufrufe.loeschen++;
      await warte(VERZOEGERUNG);
      zeilen.delete(id);
    },
    async bildHochladen(datei) {
      await warte(VERZOEGERUNG);
      return { url: '/favicon.svg' };
    },
  };
  window.__api = api;             // damit die Prüfung einzelne Methoden zeitweise ersetzen kann

  /* Startzustand: ein Block jeder Art, damit die Prüfung alle zwölf sieht. */
  const anfangsBloecke = [
    { id: 'blk-text', seite_id: 's1', typ: 'text', inhalt: { roh: 'Ein normaler Absatz mit **fett** und *kursiv*.' }, breite: 'normal', bewegung: 'keine', notiz: 'Geheime Notiz — darf nie öffentlich zu sehen sein.', sort_order: 1 },
    { id: 'blk-ueb',  seite_id: 's1', typ: 'ueberschrift', inhalt: { roh: '## Eine Überschrift' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 2 },
    { id: 'blk-rn',   seite_id: 's1', typ: 'randnotiz', inhalt: { titel: 'Kunde', zeile1: 'Beispiel GmbH', zeile2: '2026', punkt: true }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 3 },
    { id: 'blk-bild', seite_id: 's1', typ: 'bild', inhalt: { roh: '![Ein Foto](/favicon.svg)' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 4 },
    { id: 'blk-gif',  seite_id: 's1', typ: 'gif', inhalt: { roh: '![](/favicon.svg)' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 5 },
    { id: 'blk-vid',  seite_id: 's1', typ: 'video', inhalt: { roh: 'https://youtu.be/dQw4w9WgXcQ' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 6 },
    { id: 'blk-tmb',  seite_id: 's1', typ: 'text_mit_bild', inhalt: { roh: ':::\nEin Absatz neben dem Bild.\n![](/favicon.svg)\n:::' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 7 },
    { id: 'blk-code', seite_id: 's1', typ: 'code', inhalt: { roh: '```js\nconst x = 1;\n```' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 8 },
    { id: 'blk-wz',   seite_id: 's1', typ: 'werkzeug', inhalt: { roh: '::demo the-race' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 9 },
    { id: 'blk-tr',   seite_id: 's1', typ: 'trenner', inhalt: { roh: '---' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 10 },
    { id: 'blk-tuer', seite_id: 's1', typ: 'tuer', inhalt: { ziel: 'https://example.com', text: 'Mehr dazu' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 11 },
    { id: 'blk-ab',   seite_id: 's1', typ: 'abschnitt', inhalt: { titel: 'Ein Abschnitt', art: 'beruflich', farbe: '#8E4E9B' }, breite: 'normal', bewegung: 'keine', notiz: '', sort_order: 12 },
  ];
  anfangsBloecke.forEach(b => zeilen.set(b.id, structuredClone(b)));

  window.__editor = mountBlockEditor(document.getElementById('block-editor'), {
    seiteId: 's1', anfangsBloecke,
    api, statusEl: document.getElementById('speicher-status'),
  });
</script>
</body>
</html>
