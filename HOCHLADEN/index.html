<!-- Scroll-Animationen fuer Engines, die sie selbst nicht koennen (Firefox).
     Chrome und Safari laufen an dieser Stelle vorbei: Sie holen null Byte
     und animieren wie bisher rein in CSS auf dem Compositor.

     Warum hier drei Dinge zusammen passieren muessen:
     1. scroll-timeline.js -- das Polyfill (flackr/scroll-timeline 1.1.0).
     2. bewegung-nachbau.css -- dieselben Regeln flach, weil der Parser des
        Polyfills nicht in @supports oder @media hineinsieht (gemessen).
     3. die Klasse mm-bewegung -- ohne sie greift der Nachbau nicht.

     Die Reihenfolge der Absicherung ist Absicht: Die Klasse wird ZULETZT
     gesetzt und nur, wenn "Bewegung reduzieren" aus ist. Ist JavaScript aus
     oder bricht hier etwas ab, traegt <html> die Klasse nie, der Nachbau
     greift nirgends -- und die Seite ist statisch und VOLLSTAENDIG sichtbar.
     Kein Inhalt haengt jemals davon ab, dass ein Skript ihn sichtbar macht.
     Siehe docs/scroll-animationen-fuer-ox-alpha.md. -->
<script>
(function () {
  if (!window.CSS || !CSS.supports) return;
  if (CSS.supports('animation-timeline: view()')) return;          /* kann es selbst */
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; /* will es nicht */
  document.write('<script src="/assets/scroll-timeline.js?v=1788536695"><\/script>');
  /* Das Polyfill zerstoert beim Umschreiben der Stylesheets die
     @font-face-Regeln. Diese Zeile registriert die Schriften danach
     ueber die JS-Schnittstelle neu -- siehe schriften-retten.js. */
  document.write('<script src="/assets/schriften-retten.js?v=1788536695"><\/script>');
  document.write('<link rel="stylesheet" href="/assets/bewegung-nachbau.css?v=1788536695">');
  document.documentElement.className += ' mm-bewegung';
})();
</script>

/* Der Ladeschirm darf NIEMALS Inhalt verstecken, wenn etwas schiefgeht.
   Deshalb wird die versteckende Klasse hier von JavaScript GESETZT statt im

(function () {

<script>
(async () => {
  const [brief, projekte] = await Promise.all([
    window.mmLoadSeite('brief', 'brief'), window.mmLoadProjektSeiten(),
  ]);
  const briefBloecke = (brief && brief.bloecke) || [];
  const abschnitte = window.mmBrief(document.getElementById('brief'),
    { briefBloecke, projekte: projekte.map(seite => ({ seite, bloecke: seite.bloecke || [] })) });

  /* Die Bildschirmbreite NICHT nur einmal beim Start lesen: dreht jemand
     ein Tablet oder zieht das Fenster über die 760px-Grenze, muss die
     Leiste ihren Scroll-Bereich wechseln (Fenster <-> Spalte) -- sonst
     spricht sie danach dauerhaft den falschen Bereich an. mmLeiste()
     bindet ihren Scroll-Beobachter beim Aufbau fest an einen Bereich, also
     bei jedem Überschreiten der Grenze die Leiste komplett neu aufbauen,
     statt zu versuchen, ihr Scroll-Ziel nachträglich auszutauschen. */
  const bruch = window.matchMedia('(max-width: 760px)');
  let leiste = null;
  function leisteAufbauen() {
    leiste?.zerstoeren();
    const scroller = bruch.matches ? document.scrollingElement : document.getElementById('scroller');
    leiste = window.mmLeiste(document.getElementById('leiste'), abschnitte, { scroller });
  }
  leisteAufbauen();
  bruch.addEventListener('change', leisteAufbauen);

  /* Die Höhe der Seite ändert sich noch, nachdem sie steht: Schriften laden nach,
     und Bilder mit loading="lazy" laden ERST, wenn man zu ihnen scrollt.
     Nicht auf sie warten — sie laden vielleicht nie. Stattdessen zusehen und
     neu rechnen, sooft sich etwas ändert. Das deckt Schriften, Bilder,
     Videofenster und alles Spätere ab. */
  await document.fonts.ready.catch(() => {});
  leiste.neuBerechnen();

  /* Jetzt steht wirklich alles: Daten da, Leiste vermessen, Schriften
     geladen. Erst hier den Ladeschirm abraeumen -- vorher saehe man das
     Nachrutschen beim Schriftwechsel. */
  window.mmLadeschirmWeg();
  window.mmTueren(document.getElementById('brief'));

  /* Nach einem Sprachwechsel dorthin zurueck, wo man vorher stand. Erst
     HIER, denn vorher hat der Brief noch nicht seine endgueltige Hoehe --
     ein frueherer Sprung liefe ins Leere. Beim normalen Aufruf liegt
     nichts gemerkt vor und die Zeile tut nichts. */
  const bereich = bruch.matches ? document.scrollingElement : document.getElementById('scroller');
  window.mmScrollWiederherstellen?.(bereich);

  let ruhe = null;
  new ResizeObserver(() => {
    clearTimeout(ruhe);
    ruhe = setTimeout(() => leiste.neuBerechnen(), 120);
  }).observe(document.getElementById('brief'));

  if (new URLSearchParams(location.search).has('danke')) {
    const f = document.getElementById('anfragen');
    f.innerHTML = '<p class="br-text">'
      + ((window.mmText && window.mmText('form-danke'))
         || 'Angekommen — ich melde mich, meistens noch am selben Tag.') + '</p>';
  }
})();
</script>

<!-- Anfrageformular ohne Seitenwechsel abschicken. Faellt dieses Skript
     aus, bleibt das action-Attribut im <form> uebrig und der Browser schickt
     ganz normal ab -- die Anfrage kommt trotzdem an, nur mit Seitenwechsel
     auf Formsprees eigene Dankeseite. Deshalb wird preventDefault() erst
     INNERHALB des Handlers aufgerufen und nicht das action-Attribut entfernt. -->
<script>
(function () {
  var form = document.getElementById('anfragen');
  if (!form || !window.fetch) return;
  /* Faellt sprache.js aus (Netz, Adblocker), ist window.mmText nicht da.
     Dann bleibt der deutsche Text stehen -- nie eine leere Meldung. */
  var T = function (schluessel, deutsch) {
    return (window.mmText ? window.mmText(schluessel) : '') || deutsch;
  };

  var antwort = document.getElementById('anfrage-antwort');
  var katze = document.getElementById('anfrage-katze');
  var knopf = form.querySelector('button[type=submit]');

  /* Die Katze. Zwei Fassungen derselben Datei:
       - bewegt, fuer alle
       - ein Standbild, fuer alle mit "Bewegung reduzieren"
     <picture> waehlt selbst und holt NUR die gewaehlte -- deshalb steht die
     Ruecksicht hier im Markup und nicht als zweite Abfrage im Skript.
     Der Dateiname traegt einen Fingerabdruck des GIFs (tests/katze-wandeln.mjs),
     darum braucht er keinen ?v=-Stempel: taucht ein anderes GIF auf, heisst
     die Datei anders. Feste Breite und Hoehe, damit beim Nachladen nichts
     springt. */
  function katzeZeigen() {
    if (!katze || katze.firstChild) return;
    katze.innerHTML =
      '<picture>' +
        '<source media="(prefers-reduced-motion: reduce)" ' +
                'srcset="/assets/katze-924d154c-standbild.webp">' +
        '<img src="/assets/katze-924d154c.webp" alt="" ' +
             'width="160" height="116" decoding="async">' +
      '</picture>';
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    antwort.className = 'br-formular-antwort';
    antwort.textContent = T('form-sendet', 'Wird gesendet …');
    if (katze) katze.innerHTML = '';
    knopf.disabled = true;
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    }).then(function (r) {
      if (r.ok) {
        form.reset();
        antwort.className = 'br-formular-antwort gut';
        antwort.textContent = T('form-gut', 'Angekommen! Ich melde mich.');
        katzeZeigen();
      } else {
        return r.json().then(function (d) {
          throw new Error((d.errors || []).map(function (f) { return f.message; }).join(', ')
            || T('form-schlecht', 'Das hat nicht geklappt.'));
        });
      }
    }).catch(function (err) {
      antwort.className = 'br-formular-antwort schlecht';
      /* Bewusst mit Ausweg: wer hier haengenbleibt, soll trotzdem
         schreiben koennen, statt einfach abzuspringen. */
      antwort.textContent = (err.message || T('form-schlecht', 'Das hat nicht geklappt.'))
