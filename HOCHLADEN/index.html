<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mausemaus — Lucas Schönwald</title>
<meta name="description" content="Lucas Schönwald — Video Editor und Motion Designer in Köln.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="mausemaus — Lucas Schönwald">
<meta property="og:description" content="Lucas Schönwald — Video Editor und Motion Designer in Köln.">
<meta property="og:image" content="https://mausemaus.com/og-bild.jpg">
<meta property="og:url" content="https://mausemaus.com/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://mausemaus.com/">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/leiste.css">
<link rel="stylesheet" href="/assets/brief.css">
</head>
<body>

<div class="br-buehne">
  <div id="leiste"></div>
  <div class="br-scroller" id="scroller">
    <div class="br-spalte">
      <div id="brief"></div>

      <form name="anfrage" method="POST" data-netlify="true"
            netlify-honeypot="bot-feld" action="/?danke=1#anfragen"
            class="br-formular" id="anfragen">
        <input type="hidden" name="form-name" value="anfrage">
        <p class="versteckt"><label>Bitte leer lassen: <input name="bot-feld"></label></p>
        <label><input type="text" name="name" placeholder="Dein Name" required></label>
        <label><input type="email" name="email" placeholder="Deine E-Mail" required></label>
        <label><textarea name="nachricht" rows="4" placeholder="Worum geht's?" required></textarea></label>
        <button type="submit">Anfrage senden →</button>
      </form>
    </div>
  </div>
</div>

<script src="/assets/config.js"></script>
<script src="/assets/seed.js"></script>
<script src="/assets/shared.js"></script>
<script src="/assets/bloecke.js"></script>
<script src="/assets/db.js"></script>
<script src="/assets/leiste.js"></script>
<script src="/assets/brief.js"></script>
<script src="/assets/tueren.js"></script>
<script>
(async () => {
  const [brief, projekte] = await Promise.all([
    window.mmLoadSeite('brief', 'brief'), window.mmLoadProjektSeiten(),
  ]);
  const briefBloecke = (brief && brief.bloecke) || [];
  const abschnitte = window.mmBrief(document.getElementById('brief'),
    { briefBloecke, projekte: projekte.map(seite => ({ seite, bloecke: seite.bloecke || [] })) });

  /* Die Bildschirmbreite NICHT nur einmal beim Start lesen: dreht jemand
     ein Tablet oder zieht das Fenster über die 760px-Grenze, muss die
     Leiste ihren Scroll-Bereich wechseln (Fenster <-> Spalte) -- sonst
     spricht sie danach dauerhaft den falschen Bereich an. mmLeiste()
     bindet ihren Scroll-Beobachter beim Aufbau fest an einen Bereich, also
     bei jedem Überschreiten der Grenze die Leiste komplett neu aufbauen,
     statt zu versuchen, ihr Scroll-Ziel nachträglich auszutauschen. */
  const bruch = window.matchMedia('(max-width: 760px)');
  let leiste = null;
  function leisteAufbauen() {
    leiste?.zerstoeren();
    const scroller = bruch.matches ? document.scrollingElement : document.getElementById('scroller');
    leiste = window.mmLeiste(document.getElementById('leiste'), abschnitte, { scroller });
  }
  leisteAufbauen();
  bruch.addEventListener('change', leisteAufbauen);

  /* Die Höhe der Seite ändert sich noch, nachdem sie steht: Schriften laden nach,
     und Bilder mit loading="lazy" laden ERST, wenn man zu ihnen scrollt.
     Nicht auf sie warten — sie laden vielleicht nie. Stattdessen zusehen und
     neu rechnen, sooft sich etwas ändert. Das deckt Schriften, Bilder,
     Videofenster und alles Spätere ab. */
  await document.fonts.ready.catch(() => {});
  leiste.neuBerechnen();
  window.mmTueren(document.getElementById('brief'));
  window.mmBloecke.bewegungEinrichten(document.getElementById('brief'));

  let ruhe = null;
  new ResizeObserver(() => {
    clearTimeout(ruhe);
    ruhe = setTimeout(() => leiste.neuBerechnen(), 120);
  }).observe(document.getElementById('brief'));

  if (new URLSearchParams(location.search).has('danke')) {
    const f = document.getElementById('anfragen');
    f.innerHTML = '<p class="br-text">Angekommen — ich melde mich, meistens noch am selben Tag.</p>';
  }
})();
</script>
</body>
</html>
