<!-- Der GESAMTE Inhalt der Seite kommt von dieser Adresse, aber der

     und gelaufen ist. Namensaufloesung und Verschluesselungs-Handschlag
     starten also erst dann. Diese Zeile stellt die Verbindung schon
     waehrend des Ladens her. crossorigin, weil die Abfragen spaeter mit
     Kopfzeilen laufen -- ohne das Wort baut der Browser eine ZWEITE
     Verbindung auf und die erste war umsonst.
     Die Adresse haelt tests/hochladen.mjs mit assets/config.js gleich. -->
<link rel="preconnect" href="https://mqkggwvcositmpemtqot.supabase.co" crossorigin id="db-preconnect">
<!-- Scroll-Animationen fuer Engines, die sie selbst nicht koennen (Firefox).
     Chrome und Safari laufen an dieser Stelle vorbei: Sie holen null Byte
     und animieren wie bisher rein in CSS auf dem Compositor.

     Warum hier drei Dinge zusammen passieren muessen:
     1. scroll-timeline.js -- das Polyfill (flackr/scroll-timeline 1.1.0).
     2. bewegung-nachbau.css -- dieselben Regeln flach, weil der Parser des
        Polyfills nicht in @supports oder @media hineinsieht (gemessen).
     3. die Klasse mm-bewegung -- ohne sie greift der Nachbau nicht.

     Die Reihenfolge der Absicherung ist Absicht: Die Klasse wird ZULETZT
     gesetzt und nur, wenn "Bewegung reduzieren" aus ist. Ist JavaScript aus
     oder bricht hier etwas ab, traegt <html> die Klasse nie, der Nachbau
     greift nirgends -- und die Seite ist statisch und VOLLSTAENDIG sichtbar.
     Kein Inhalt haengt jemals davon ab, dass ein Skript ihn sichtbar macht.
     Siehe docs/scroll-animationen-fuer-ox-alpha.md. -->
<script>
(function () {
  if (!window.CSS || !CSS.supports) return;
  if (CSS.supports('animation-timeline: view()')) return;          /* kann es selbst */
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; /* will es nicht */
  document.write('<script src="/assets/scroll-timeline.js?v=1787944189"><\/script>');
  /* Das Polyfill zerstoert beim Umschreiben der Stylesheets die
     @font-face-Regeln. Diese Zeile registriert die Schriften danach
     ueber die JS-Schnittstelle neu -- siehe schriften-retten.js. */
  document.write('<script src="/assets/schriften-retten.js?v=1787944189"><\/script>');
  document.write('<link rel="stylesheet" href="/assets/bewegung-nachbau.css?v=1787944189">');
  document.documentElement.className += ' mm-bewegung';
})();
</script>
<!-- Die zwei Schnitte, die oben sofort sichtbar sind (der grosse Gruss in
     Tropi, der Fliesstext in Manrope), schon jetzt anfordern statt
     erst, wenn das CSS gelesen ist. Bewusst NUR diese beiden: laedt man alle

     gerade beseitigt hat. Die Namen tragen einen Fingerabdruck des Inhalts
     und werden von tests/schriften-loesen.mjs vergeben.
     crossorigin ist bei Schriften Pflicht -- ohne das Wort laedt der Browser
     die Datei ein ZWEITES Mal, statt die vorgeladene zu nehmen. -->
<link rel="preload" href="/assets/schriften/tropi-400-f3e64d11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/schriften/manrope-var-e310b55a.woff2" as="font" type="font/woff2" crossorigin>

<body>
<div class="welt" id="welt">
  <div class="welt-spalte">
    <a class="welt-zurueck" href="/">← zurück in den Brief</a>
    <noscript>
      <div class="welt-text">
        <p>Diese Seite baut ihren Inhalt mit JavaScript auf — im Moment ist es
        abgeschaltet, deshalb steht hier nichts.</p>
        <p>Schreib mir gern direkt: <a href="mailto:lucasschoenwald03@gmail.com">lucasschoenwald03@gmail.com</a></p>
      </div>
    </noscript>
    <div id="inhalt"></div>

<script src="/assets/config.js?v=1787944189"></script>
<script src="/assets/shared.js?v=1787944189"></script>
<script src="/assets/bloecke.js?v=1787944189"></script>
<script src="/assets/db.js?v=1787944189"></script>

<script src="/assets/demo-race.js?v=1787944189"></script>
<script src="/assets/inhalt.js?v=1787944189"></script>
<script>
(async () => {
  /* GitHub Pages liefert /welt/xy aus, weil es von sich aus ".html" anhaengt
     — der Name steht in der Adresse.
     Eine kaputte Adresse (z.B. ein einzelnes "%" gefolgt von etwas, das keine
     gültige Prozent-Kodierung ist, wie /welt/100%zz) lässt decodeURIComponent
     mit einem URIError abbrechen -- ungefangen bliebe die ganze Seite leer.
     Dann einfach den rohen (nicht dekodierten) Text nehmen: der findet sowieso
     keine Welt, und mmLoadSeite zeigt in dem Fall die freundliche
     "Hier ist nichts"-Seite weiter unten. */
  /* Das ".html" abschneiden: seit tests/hochladen.mjs vorgebaute Fassungen
     unter /welt/<slug>.html liegen, kann jemand genau die Adresse erwischen
     -- ohne diese Zeile suchte die Seite dann nach einer Welt namens
     "absent.html" und zeigte "Hier ist nichts". */
  /* Zweiter Weg herein: /welt.html?s=<slug>. Den benutzt 404.html fuer
     Welten, die es in der Datenbank schon gibt, aber noch nicht als
     vorgebaute Datei -- also alles, was Lucas gerade erst im Admin angelegt
     hat. Ohne diesen Weg waere eine neue Welt bis zum naechsten Hochladen
     nicht erreichbar, obwohl sie im Brief schon verlinkt ist.
     Die haessliche Adresse wird gleich danach wieder gerade gezogen. */
  const ausAbfrage = new URLSearchParams(location.search).get('s');
  const roherSlug = ausAbfrage
    || (location.pathname.split('/').filter(Boolean).pop() || '').replace(/\.html$/, '');
  let slug;
  try { slug = decodeURIComponent(roherSlug); }
  catch { slug = roherSlug; }
  const ziel = document.getElementById('inhalt');
  const welt = document.getElementById('welt');

  const seite = await window.mmLoadSeite('welt', slug);
  if (!seite) {
    document.title = 'Nicht gefunden — mausemaus';
    ziel.innerHTML = '<h1 class="welt-titel">Hier ist nichts.</h1>' +
      '<p class="welt-text">Diese Tür führt ins Leere. Zurück in den Brief?</p>';
    return;
  }

  /* Die Adresse auf die schoene Form bringen, falls wir ueber ?s= hereinkamen.
     replaceState statt pushState: der Zurueck-Knopf soll nicht auf die
     Umleitung zeigen, sonst kaeme man beim Zurueckgehen wieder hierher. */
  if (ausAbfrage) history.replaceState(null, '', '/welt/' + encodeURIComponent(slug));

  document.title = seite.titel + ' — mausemaus';

  /* Teilen-Vorschau (WhatsApp, Twitter/X, …) aus den echten Daten der Welt
     nachtragen -- die feststehenden Werte im <head> sind nur der
     Grundstock für den kurzen Moment, bevor diese Zeilen laufen, und für
     den Fall, dass etwas davon fehlt. */
  const setzeMeta = (id, attr, wert) => {
    const el = document.getElementById(id);
    if (el && wert) el.setAttribute(attr, wert);
  };
  setzeMeta('og-title', 'content', seite.titel + ' — mausemaus');
  if (seite.untertitel) setzeMeta('og-description', 'content', seite.untertitel);
  /* Das Vorschaubild NUR nachtragen, wenn im <head> noch das allgemeine
     Ausweichbild steht. Sonst hat tests/hochladen.mjs hier schon eine
     JPEG-Fassung eingesetzt (1200x630) -- und die ist besser als das, was
     hier stuende: die Bilder aus dem Admin liegen als WebP in der Datenbank,
     und WhatsApp, Facebook und LinkedIn zeigen WebP als Vorschau
     unzuverlaessig bis gar nicht. Ohne diese Bedingung machte das Skript
     die Arbeit des Vorbauens wieder zunichte.
     Fuer eine im Admin frisch angelegte Welt, die noch nicht vorgebaut ist,
     greift der Zweig weiterhin -- dort ist ein WebP besser als nichts. */
  const nochAusweichbild = (id) => {
    const el = document.getElementById(id);
    return el && /\/og-bild\.jpg$/.test(el.getAttribute('content') || '');
  };
  if (seite.cover_url && nochAusweichbild('og-image')) setzeMeta('og-image', 'content', seite.cover_url);
  /* Die kanonische Adresse ist FEST, nicht die gerade aufgerufene. Vorher
     stand hier location.origin + location.pathname -- und weil dieselbe Welt
     unter drei Adressen antwortet (/welt/<slug>, /welt/<slug>.html und der
     alten Form /blog/<slug>, alle drei mit 200 gemessen), zeigte der Verweis
     dann jeweils auf sich selbst. Google sah drei Seiten statt einer und
     verteilte die Wertung darauf. Jetzt zeigen alle drei auf dieselbe. */
  const kanonisch = 'https://mausemaus.com/welt/' + slug;
  setzeMeta('og-url', 'content', kanonisch);
  setzeMeta('og-canonical', 'href', kanonisch);
  if (seite.untertitel) setzeMeta('meta-description', 'content', seite.untertitel);
  setzeMeta('tw-title', 'content', seite.titel + ' — mausemaus');
  if (seite.untertitel) setzeMeta('tw-description', 'content', seite.untertitel);
  if (seite.cover_url && nochAusweichbild('tw-image')) setzeMeta('tw-image', 'content', seite.cover_url);
  if (seite.farbe) {
    welt.style.setProperty('--welt', seite.farbe);
    /* Dunkle Farbstimmung, wenn die Farbe dunkel ist. */
    const h = seite.farbe.replace('#', '');
    if (h.length === 6) {
      const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
      if (0.2126 * r + 0.7152 * g + 0.0722 * b < 110) welt.classList.add('dunkel');
    }
  }

  ziel.innerHTML =
    (seite.untertitel ? '<p class="welt-kicker">' + window.mm.esc(seite.untertitel) + '</p>' : '') +
    '<h1 class="welt-titel">' + window.mm.esc(seite.titel) + '</h1>' +
    (seite.cover_url ? '<img class="welt-cover" src="' + window.mm.esc(seite.cover_url) +
      '" alt="" style="object-position:' + window.mm.esc(seite.cover_pos || '50% 50%') + '">' : '') +
    '<div class="welt-text">' + window.mmBloecke.seite(seite.bloecke) + '</div>';

  window.mmTueren(ziel);
  window.mmInhalt(ziel);

  /* Deko-Blumen. Eine Welt hat keine Abschnitte wie der Brief, deshalb
     dienen der Titel und jeder fünfte Absatz als Anker. Bewusst nur
     Absätze und Überschriften: an einem Bild oder einer Werkzeug-Einlage
     würde die zusätzliche Malebene deren eigene Positionierung stören. */
  const ankerKandidaten = [...ziel.querySelectorAll('.welt-text > p, .welt-text > h2, .welt-text > h3')];
  window.mmBlumen([
    ziel.querySelector('.welt-titel'),
    ...ankerKandidaten.filter((_, i) => i % 5 === 4),
  ], { anzahl: 1 });
})();
</script>
